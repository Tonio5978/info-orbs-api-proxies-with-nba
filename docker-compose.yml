services:
  proxy:
    build: .
    env_file: .env
    ports:
      - "80:80"
    volumes:
      - timezone_cache:/var/cache/timezone_proxy
      - ./mlb_logos:/app/mlb_logos
      - ./nfl_logos:/app/nfl_logos
      - ./nba_logos:/app/nba_logos
      - ./soccer_logos:/app/soccer_logos  # Filled by scripts/download_soccer_logos.py
      - ./config:/app/config:ro  # Soccer competitions and aliases, editable without rebuilding
    restart: unless-stopped
    logging:
      options:
        max-size: "2m"
        max-file: "5"    

volumes:
  timezone_cache:  # Auto-created if doesn't exist
